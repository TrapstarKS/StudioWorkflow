name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: studioworkflow --version
      - name: Verify wheel resources
        working-directory: ${{ runner.temp }}
        run: python -c "from importlib.resources import files; p=files('studioworkflow'); assert p.joinpath('observer.luau').is_file(); assert p.joinpath('skill/SKILL.md').is_file()"

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install Lune for mocked plugin tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.10.5 --repo lune-org/lune --pattern lune-0.10.5-linux-x86_64.zip --dir "$RUNNER_TEMP/lune"
          unzip "$RUNNER_TEMP/lune/lune-0.10.5-linux-x86_64.zip" -d "$RUNNER_TEMP/lune/bin"
          chmod +x "$RUNNER_TEMP/lune/bin/lune"
          echo "$RUNNER_TEMP/lune/bin" >> "$GITHUB_PATH"
      - run: python -m unittest discover -s tests -v
